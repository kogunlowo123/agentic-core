[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-core"
version = "0.1.0"
description = "Shared kernel for enterprise agentic AI platforms: model routing, policy, audit, provenance, security filters, telemetry."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Citadel" }]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.16.0,<3",
  "httpx>=0.27,<1",
  "structlog>=24.1",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "cryptography>=43",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.35"]
otlp = ["opentelemetry-exporter-otlp-proto-grpc>=1.27"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "mypy>=1.11",
  "ruff>=0.6",
  "black>=24.8",
  "bandit>=1.7.10",
  "types-pyyaml>=6.0",
  "boto3>=1.35",
  "boto3-stubs[bedrock-runtime]>=1.35",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_core"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src",
  "tests",
  "docs",
  "configs",
  "policies",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "SECURITY.md",
  "pyproject.toml",
  "uv.lock",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "ASYNC", "PT", "TID", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["agentic_core"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=agentic_core --cov-report=term-missing --cov-fail-under=90"
markers = [
  "integration: crosses a process or network boundary",
  "security: adversarial security test",
  "chaos: fault-injection test",
  "performance: latency or throughput test",
]

[tool.coverage.run]
branch = true
source = ["agentic_core"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]

[tool.bandit]
exclude_dirs = ["tests"]
