name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --all-extras
      - name: Full quality gate
        run: |
          uv run ruff check src tests
          uv run black --check src tests
          uv run mypy
          uv run bandit -q -r src -c pyproject.toml
          uv run pytest
      - name: Verify tag matches package version
        run: |
          version=$(uv run python -c "import agentic_core; print(agentic_core.__version__)")
          test "v${version}" = "${GITHUB_REF_NAME}"
      - run: uv build
      - name: SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
